# Installed as conf-enabled/zz-app.conf by the Dockerfile.

# Error pages and the Server header do not name the Apache version.
ServerTokens Prod
ServerSignature Off

# Every page reference to /assets/ carries ?v=<mtime> (App\View\Assets), so a
# changed file gets a new URL and the old one can be cached for a year, at
# Cloudflare's edge as well.
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Fixed URLs that crawlers and browsers ask for by name.
<LocationMatch "^/(favicon\.ico|robots\.txt|sitemap\.xml)$">
    Header set Cache-Control "public, max-age=86400"
</LocationMatch>
